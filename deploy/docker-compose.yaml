services:

  # ─── Reference Client ────────────────────────────────────────────────────────

  reference-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reference_db
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    volumes:
      - reference_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  reference-backend:
    build:
      context: ../reference-client/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@reference-db:5432/reference_db
      AXYRA_CONSOLE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      reference-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  reference-frontend:
    build:
      context: ../reference-client/frontend
      dockerfile: Dockerfile
      args:
        # Inlined at build time. These are URLs the *browser* uses, hence localhost.
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_AXYRA_URL: http://localhost:5173
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      reference-backend:
        condition: service_healthy

  # ─── Axyra Agent (runs alongside reference-db, reads WAL) ────────────────────

  axyra-agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@reference-db:5432/reference_db?sslmode=disable
      AXYRA_ENDPOINT: http://analytics:8082
      AXYRA_AGENT_TOKEN: ${AXYRA_AGENT_TOKEN}
      REPLICATION_SLOT: axyra_slot
    depends_on:
      reference-db:
        condition: service_healthy
      analytics:
        condition: service_healthy
    volumes:
      - ../configs/agent-example.yaml:/etc/axyra/agent.yaml:ro

  # ─── Axyra Platform ──────────────────────────────────────────────────────────

  platform-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: axyra_platform
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axyra_platform"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ../services/control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@platform-db:5432/axyra_platform?sslmode=disable
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics:8082
      AXYRA_AGENT_TOKEN: ${AXYRA_AGENT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      # Console logins. If a password is empty, one is generated and printed once in the logs.
      AXYRA_ADMIN_PASSWORD: ${AXYRA_ADMIN_PASSWORD:-}
      AXYRA_OPERATOR_PASSWORD: ${AXYRA_OPERATOR_PASSWORD:-}
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      platform-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  analytics:
    build:
      context: ../services/analytics
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@platform-db:5432/axyra_platform?sslmode=disable
      REDIS_URL: redis://redis:6379
      CONTROL_PLANE_URL: http://control-plane:8081
      PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      platform-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ─── Axyra Web Console ───────────────────────────────────────────────────────

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # Vite inlines this at build time, so it must be a build argument, not a runtime env var.
        VITE_API_URL: http://localhost:8081
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      control-plane:
        condition: service_healthy
      analytics:
        condition: service_healthy

volumes:
  reference_db_data:
  platform_db_data:

